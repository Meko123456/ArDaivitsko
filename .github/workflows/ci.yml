name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A timeout on every job: GitHub's default is six hours, and a job that hangs (an emulator or a
# simulator that never comes up) would otherwise hold the run, and keep its log unreadable, all that
# time. The repo is public, so these minutes don't count against the account's allowance.
jobs:
  android-build:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The planner's tests reproduce every worked example in docs/behaviour.md to the minute.
      - name: Unit tests, debug build and lint
        run: ./gradlew test :app:assembleDebug :app:lintDebug --stacktrace

      # assembleRelease runs R8, and lintVitalRelease can fail where lintDebug is green.
      - name: Release build (R8) and release lint
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Upload reports when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/**/build/reports/

  android-instrumented:
    # Room only runs on a real platform, and the notification's buttons are pressed through their
    # real PendingIntents; then a user adds a task and marks it Done.
    name: Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      # On AGP 9 a connected task can pass having run nothing (a failed install is only logged), so
      # the report is read and the job fails if no test ran.
      - name: Check the instrumented tests actually ran
        run: |
          python3 - <<'PY'
          import re, sys
          page = open("app/build/reports/androidTests/connected/debug/index.html").read()
          count = {k: int(re.search(rf'id="{k}">\s*<div class="counter">(\d+)</div>', page).group(1)) for k in ("tests", "failures", "skipped")}
          print(f"app: {count['tests']} tests, {count['failures']} failed, {count['skipped']} skipped")
          sys.exit(0 if count["tests"] > 0 else 1)
          PY

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-report
          path: android/app/build/reports/androidTests/

  android-release-launches:
    # Building the release proves R8 ran, not that the result starts: R8 can strip what a library
    # reaches by reflection (Glance needs WorkManager 2.12 or a minified app dies at launch), and
    # only opening the app shows it.
    name: Android release build launches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # CI has no release key, so the build comes out unsigned. Any key will do for installing it
      # on a throwaway emulator, so this makes one up.
      - name: Build the minified release and sign it with a throwaway key
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          keytool -genkeypair -keystore "$RUNNER_TEMP/launch.jks" -storepass launchcheck \
            -keypass launchcheck -alias launch -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=release launch check"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/launch.jks" --ks-pass pass:launchcheck \
            --key-pass pass:launchcheck --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/launch-release.sh ${{ runner.temp }}/release.apk

  ios:
    name: iOS package tests, build and UI tests
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      # AlarmKit needs the iOS 26 SDK; the runner's Xcode is printed so a change shows here first.
      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      # The planner's tests reproduce every worked example in docs/behaviour.md to the minute.
      - name: Package tests
        working-directory: ios/ArDaivitskoKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # The project is generated rather than committed, so generating it is part of the check.
      - name: Generate the Xcode project
        run: xcodegen generate

      # Chosen, not named: runner images change which simulators they carry.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using $UDID"

      # Builds the app and its widget, then drives the app: add a task, answer it, Not today with
      # Undo, a quiet missed day and Skip. The SpringBoard checks are opt-in and skipped here.
      - name: UI tests on the simulator
        run: |
          xcodebuild test -project ArDaivitsko.xcodeproj -scheme ArDaivitsko \
                     -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug
