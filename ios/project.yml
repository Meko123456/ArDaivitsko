name: ArDaivitsko
options:
  deploymentTarget:
    iOS: "17.0"
  # The project is generated from this file and not committed: `xcodegen generate`.
  createIntermediateGroups: true
packages:
  ArDaivitskoKit:
    path: ArDaivitskoKit
targets:
  ArDaivitsko:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ar Daivitsko
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Asked when the first Can't-miss task is added (iOS 26 and later).
        NSAlarmKitUsageDescription: A task you can't miss rings like an alarm clock in its last hour, so a deadline can't slip by during a meeting.
        # Fills the next 48 hours of nudges again while the app is closed.
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.meko123456.ardaivitsko.refresh
        UIBackgroundModes:
          - fetch
        # The widget opens Today, and a task with ardaivitsko://task/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.meko123456.ardaivitsko
            CFBundleURLSchemes:
              - ardaivitsko
    entitlements:
      path: App/ArDaivitsko.entitlements
      properties:
        # Where the task store lives, so the widget reads the same tasks.
        com.apple.security.application-groups:
          - group.io.github.meko123456.ardaivitsko
        # A nudge may break through a Focus that allows time-sensitive notifications: the meeting
        # that swallowed the credit card reminder.
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - package: ArDaivitskoKit
        product: NudgeKit
      - package: ArDaivitskoKit
        product: TaskStore
      - package: ArDaivitskoKit
        product: Nudges
      - package: ArDaivitskoKit
        product: Nudger
      - target: ArDaivitskoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.ardaivitsko
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ArDaivitskoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ar Daivitsko
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ArDaivitskoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.meko123456.ardaivitsko
    dependencies:
      - package: ArDaivitskoKit
        product: NudgeKit
      - package: ArDaivitskoKit
        product: TaskStore
      - package: ArDaivitskoKit
        product: Nudges
      # For the Done button's intent, which runs in the app's process.
      - package: ArDaivitskoKit
        product: Nudger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.ardaivitsko.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
  ArDaivitskoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ArDaivitsko
      # The tests write the tasks each one starts from.
      - package: ArDaivitskoKit
        product: NudgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.ardaivitsko.uitests
        TEST_TARGET_NAME: ArDaivitsko
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  ArDaivitsko:
    build:
      targets:
        ArDaivitsko: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArDaivitskoUITests
